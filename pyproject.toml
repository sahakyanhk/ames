[build-system]
# Pinned to match the runtime pin below so an isolated build and an
# in-env (--no-build-isolation) rebuild use the same pybind11 headers.
requires = ["setuptools", "pybind11==3.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ames"
version = "1.0.0"
requires-python = ">=3.10"
description = "atomistic molecular evolution simulator"
readme = "README.md"

# Imported by src/ames.py at module load on every run, regardless of engine.
# Keep this list engine-agnostic - per-engine stacks go in optional-dependencies.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2.2",
    "pybind11==3.0.1",   # also a build requirement; kept here so
                         # `pip install --no-build-isolation -e .` finds it
    "biotite>=1.0.0",    # rnatools: secondary structure / dot-bracket
    "zstandard",         # amestools: CIF compression in the run log
    "matplotlib",        # visualames
    "tqdm",              # visualames
]

[project.optional-dependencies]
esmfold2 = [
    "esm @ git+https://github.com/Biohub/esm.git@main",
]
