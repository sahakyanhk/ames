[build-system]
requires = ["setuptools", "pybind11==3.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ames"
version = "0.1.0"
requires-python = ">=3.10"
description = "atomistic molecular evolution simulator"
readme = "README.md"

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2.2",
    "pybind11==3.0.1",   # also a build requirement; kept here so
                         # `pip install --no-build-isolation -e .` finds it
    "biotite>=1.0.0",    # rnatools: secondary structure / dot-bracket
    "zstandard",         # amestools: CIF compression in the run log
    "matplotlib",        # visualames
    "tqdm",              # visualames
]

[project.optional-dependencies]
esmfold2 = [
    "esm>=3.4.1",   # PyPI; provides esm.models.esmfold2
]

[project.scripts]
ames = "ames.ames:main"
visualames = "ames.visualames:main"
ames-fold = "ames.fold:main"
ames-rndgen = "ames.rndgen:main"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ames = ["data/*.json", "bin/psique", "pdb_contacts.cpp"]
